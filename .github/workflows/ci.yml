name: pipelining in github actions

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build image
        run: docker build -t ${{ secrets.USERNAME }}/app:latest .

      - name: Push image
        run: docker push ${{ secrets.USERNAME }}/app:latest
